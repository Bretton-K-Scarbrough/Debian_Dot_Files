backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 8;

# Default opacity
# active-opacity = 0.93;
# inactive-opacity = 0.93;
# active-opacity = 0.99;
# inactive-opacity = 0.99;
active-opacity = 1;
inactive-opacity = 1;

# Let applications control their own opacity when needed
detect-client-opacity = true;

# Rounded corners, if your picom build supports them
# corner-radius = 10;

# Avoid transparency on some window types
opacity-rule = [
    "100:class_g = 'steam'",
    "100:class_g *= 'steam_app_'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'Blueman-applet'",
    "100:window_type = 'notification'",
    "100:window_type = 'dock'"
];

# Don't shadow desktop/dock-ish windows
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Rofi'"
];

# Better behavior with fullscreen windows
unredir-if-possible = false;

# Experimental blur behind transparent windows
# blur-method = "dual_kawase";
blur-method = "box";
blur-strength = 700;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Rofi'"
];
